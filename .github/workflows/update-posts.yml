name: Update Blog Posts and Projects

on:
  schedule:
    # Runs every Sunday at 00:00 UTC
    - cron: '0 0 * * 0'
  workflow_dispatch: # Allows manual one-click trigger from GitHub Actions UI

permissions:
  contents: write

jobs:
  update-posts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch latest posts from Hashnode RSS
        # Hashnode may block automated requests; keep the existing posts and still update projects
        continue-on-error: true
        run: python fetch_posts.py

      - name: Fetch projects tagged 'portfolio' from GitHub
        run: python fetch_projects.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add latest-posts.json projects.json
          if git diff --staged --quiet; then
            echo "No new posts, projects or changes to commit."
          else
            git commit -m "chore: update latest blog posts and projects"
            git push
          fi
